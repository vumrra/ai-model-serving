apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qwen-wsl2-gpu
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vumrra/ai-model-serving.git
    targetRevision: main
    path: stacks/wsl2-gpu/gitops
    helm:
      releaseName: qwen-wsl2-gpu
      parameters:
        - name: repoRevision
          value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
