apiVersion: v1
kind: Pod
metadata:
  name: wsl2-gpu-smoke
spec:
  restartPolicy: Never
  containers:
    - name: nvidia-smi
      image: docker.io/vllm/vllm-openai:v0.8.5@sha256:6cf9808ca8810fc6c3fd0451c2e7784fb224590d81f7db338e7eaf3c02a33d33
      imagePullPolicy: IfNotPresent
      command: [nvidia-smi]
      resources:
        limits:
          nvidia.com/gpu: 1
