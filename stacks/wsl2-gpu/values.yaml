name: qwen-vllm-gpu

runtime:
  name: qwen-vllm-gpu
  image: docker.io/vllm/vllm-openai:v0.8.5@sha256:6cf9808ca8810fc6c3fd0451c2e7784fb224590d81f7db338e7eaf3c02a33d33
  imagePullPolicy: IfNotPresent
  port: 8000
  command: []
  args:
    - --model
    - Qwen/Qwen3-1.7B
    - --revision
    - 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    - --dtype
    - float16
    - --max-model-len
    - "1024"
    - --max-num-seqs
    - "1"
    - --gpu-memory-utilization
    - "0.85"
    - --swap-space
    - "0"
    - --served-model-name
    - qwen3-1.7b
  env:
    HF_HOME: /root/.cache/huggingface
    HF_HUB_DISABLE_XET: "1"
    VLLM_CACHE_ROOT: /root/.cache/vllm
  shmSize: 1Gi
  extraVolumes:
    - name: wsl2-dxcore
      hostPath:
        path: /usr/lib/x86_64-linux-gnu/libdxcore.so
        type: File
  extraVolumeMounts:
    - name: wsl2-dxcore
      mountPath: /usr/lib/x86_64-linux-gnu/libdxcore.so
      readOnly: true
  startupProbeFailureThreshold: 90

cache:
  enabled: true
  mountPath: /root/.cache
  size: 16Gi
  accessMode: ReadWriteOnce
  storageClassName: standard

model:
  format: huggingface
  id: Qwen/Qwen3-1.7B
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  alias: qwen3-1.7b
  enableThinking: false

predictor:
  deploymentStrategy:
    type: Recreate

resources:
  requests:
    cpu: "2"
    memory: 6Gi
    nvidia.com/gpu: 1
  limits:
    cpu: "6"
    memory: 8Gi
    nvidia.com/gpu: 1
