name: qwen-mlx

runtime:
  name: qwen-mlx-cpu
  image: qwen-mlx-cpu:local
  imagePullPolicy: IfNotPresent
  port: 8000
  command: []
  args: []
  env: {}
  shmSize: ""
  extraVolumes: []
  extraVolumeMounts: []
  startupProbeFailureThreshold: 180

cache:
  enabled: false
  mountPath: /root/.cache/huggingface
  size: 12Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

model:
  format: huggingface
  id: mlx-community/Qwen3-4B-4bit
  revision: 4dcb3d101c2a062e5c1d4bb173588c54ea6c4d25
  alias: default_model
  enableThinking: true

predictor:
  deploymentStrategy:
    type: RollingUpdate

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi
