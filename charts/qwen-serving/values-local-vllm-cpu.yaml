name: qwen-vllm-cpu

runtime:
  name: qwen-vllm-cpu
  image: docker.io/vllm/vllm-openai-cpu:v0.27.1-arm64@sha256:e6745d7ba6610f637c6f22fc06cd730342e50245b6c46767235600483adfbbde
  imagePullPolicy: IfNotPresent
  port: 8000
  shmSize: 1Gi
  startupProbeFailureThreshold: 540
  args:
    - Qwen/Qwen3-1.7B
    - --revision
    - 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    - --served-model-name
    - qwen3-1.7b
    - --dtype
    - bfloat16
    - --max-model-len
    - "1024"
    - --max-num-seqs
    - "1"
  env:
    VLLM_CPU_KVCACHE_SPACE: "1"

cache:
  enabled: true
  size: 12Gi
  storageClassName: standard

model:
  format: huggingface
  id: Qwen/Qwen3-1.7B
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  alias: qwen3-1.7b
  enableThinking: false

predictor:
  deploymentStrategy:
    type: Recreate

resources:
  requests:
    cpu: "2"
    memory: 6Gi
  limits:
    cpu: "4"
    memory: 10Gi
