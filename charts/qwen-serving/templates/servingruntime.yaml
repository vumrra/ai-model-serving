apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.runtime.name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  supportedModelFormats:
    - name: {{ .Values.model.format }}
      version: "1"
      autoSelect: false
  protocolVersions:
    - v1
  storageHelper:
    disabled: true
  {{- if .Values.runtime.shmSize }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: {{ .Values.runtime.shmSize | quote }}
  {{- end }}
  containers:
    - name: kserve-container
      image: {{ required "runtime.image is required" .Values.runtime.image | quote }}
      imagePullPolicy: {{ .Values.runtime.imagePullPolicy }}
      {{- with .Values.runtime.command }}
      command:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.args }}
      args:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.runtime.shmSize }}
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      {{- end }}
      ports:
        - name: http1
          containerPort: {{ .Values.runtime.port }}
          protocol: TCP
      env:
        - name: MODEL_ID
          value: {{ .Values.model.id | quote }}
        - name: MODEL_REVISION
          value: {{ .Values.model.revision | quote }}
        - name: SERVED_MODEL_NAME
          value: {{ .Values.model.alias | quote }}
        - name: ENABLE_THINKING
          value: {{ .Values.model.enableThinking | quote }}
        {{- range $name, $value := .Values.runtime.env }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
      startupProbe:
        httpGet:
          path: /v1/models
          port: {{ .Values.runtime.port }}
        periodSeconds: 10
        failureThreshold: 180
      readinessProbe:
        httpGet:
          path: /v1/models
          port: {{ .Values.runtime.port }}
        periodSeconds: 10
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
