[project]
name = "qwen-serving-lab"
version = "0.1.0"
description = "Qwen 서빙 엔진 비교와 production-shaped API 배포 실습"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["apps", "benchmarks", "deploy", "engines", "evals", "scripts"]

[tool.coverage.run]
source = ["apps/gateway"]
