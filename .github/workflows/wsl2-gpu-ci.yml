name: wsl2-gpu-ci

on:
  pull_request:
    paths:
      - stacks/wsl2-gpu/**
      - .github/workflows/wsl2-gpu-ci.yml
  push:
    branches: [main]
    paths:
      - stacks/wsl2-gpu/**
      - .github/workflows/wsl2-gpu-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff check stacks/wsl2-gpu
      - run: helm lint charts/qwen-serving --values stacks/wsl2-gpu/values.yaml
      - run: helm lint stacks/wsl2-gpu/gateway
      - run: uv run pytest stacks/wsl2-gpu/test_contract.py
