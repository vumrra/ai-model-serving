name: benchmark-gpu

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Benchmark image including digest
        required: true
      planned_hours:
        default: "2"
        required: true

permissions:
  contents: read

concurrency:
  group: qwen-gpu-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: gpu-staging
    timeout-minutes: 240
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_REGISTRY_AUTH_ID: ${{ secrets.RUNPOD_REGISTRY_AUTH_ID }}
      ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
      MODEL_ID: ${{ vars.MODEL_ID }}
      MODEL_REVISION: ${{ vars.MODEL_REVISION }}
      PLANNED_HOURS: ${{ inputs.planned_hours }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - name: Check planned cost budget
        run: >-
          uv run python scripts/check_cost_budget.py
          --cost-per-hour '${{ vars.RUNPOD_MAX_HOURLY_RATE }}'
          --planned-hours "$PLANNED_HOURS"
          --budget '${{ vars.RUNPOD_JOB_BUDGET }}'
      - name: Create benchmark Pod
        run: >-
          uv run python deploy/runpod/create_pod.py
          --image '${{ inputs.image_digest }}'
          --release-id '${{ github.sha }}'
          --purpose benchmark
          --ttl-minutes 240
          --output pod.json
      - name: Wait and benchmark
        run: |
          uv run python deploy/runpod/wait_ready.py --pod-file pod.json --api-key "$ENGINE_API_KEY"
          ENGINE_URL="$(python -c 'import json; print(json.load(open("pod.json"))["proxyUrl"] + "/v1/chat/completions")')"
          uv run python -m benchmarks.runner \
            --endpoint "$ENGINE_URL" \
            --workload benchmarks/workloads/mixed.yaml \
            --engine '${{ vars.BENCHMARK_ENGINE }}' \
            --model "$MODEL_ID" \
            --model-revision "$MODEL_REVISION" \
            --api-key-env ENGINE_API_KEY \
            --output benchmarks/raw/${{ github.run_id }}.json
          uv run python -m benchmarks.summarize \
            benchmarks/raw/${{ github.run_id }}.json \
            --output benchmarks/reports/${{ github.run_id }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmarks/raw
            benchmarks/reports
            pod.json
          retention-days: 1
      - name: Always terminate Pod
        if: always()
        run: test ! -f pod.json || uv run python deploy/runpod/delete_pod.py --pod-file pod.json
