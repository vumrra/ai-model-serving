name: build-images

on:
  workflow_dispatch:
    inputs:
      runtime:
        type: choice
        options: [vllm, sglang]
        required: true
      runtime_base_image:
        description: "Upstream image with tag and sha256 digest"
        required: true
      engine_version:
        description: "vLLM or SGLang version in the upstream image"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: astral-sh/setup-uv@v6
      - name: Login to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GAR_REGION }}-docker.pkg.dev" --quiet
      - name: Build runtime by immutable Git SHA
        id: runtime-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engines/${{ inputs.runtime }}/Dockerfile
          build-args: BASE_IMAGE=${{ inputs.runtime_base_image }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qwen-runtime:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build Gateway
        id: gateway-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/gateway.Dockerfile
          push: true
          tags: >-
            ${{ vars.GAR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/qwen-gateway:${{ github.sha }}
          provenance: true
          sbom: true
      - run: uv sync --dev
      - name: Create immutable release manifest
        run: >-
          uv run python scripts/make_release.py
          --gateway-image '${{ vars.GAR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/qwen-gateway@${{ steps.gateway-image.outputs.digest }}'
          --runtime-image 'ghcr.io/${{ github.repository_owner }}/qwen-runtime@${{ steps.runtime-image.outputs.digest }}'
          --engine '${{ inputs.runtime }}'
          --engine-version '${{ inputs.engine_version }}'
          --dtype bfloat16
          --serving-config 'engines/${{ inputs.runtime }}/launch.yaml'
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: releases/generated/*.json
