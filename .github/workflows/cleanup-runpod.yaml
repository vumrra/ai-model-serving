name: cleanup-runpod

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-runpod-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: gpu-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - run: uv run python deploy/runpod/cleanup_expired.py --apply
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
