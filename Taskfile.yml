version: "3"

tasks:
  install:
    desc: 개발 의존성을 설치합니다.
    cmds:
      - uv sync --dev

  dev:
    desc: Gateway와 Mock Engine을 함께 실행합니다.
    cmds:
      - uv run python scripts/run_local.py

  cpu-serve:
    desc: 실제 Qwen3-0.6B를 CPU에서 실행합니다.
    cmds:
      - uv run --group cpu-smoke python -m scripts.run_transformers_cpu

  cpu-smoke:
    desc: 실제 Qwen3-0.6B의 CPU JSON·SSE 계약을 검사합니다.
    cmds:
      - env RUN_CPU_MODEL_SMOKE=1 uv run --group cpu-smoke pytest tests/integration/test_transformers_cpu_smoke.py

  llama-serve:
    desc: Qwen3-0.6B Q4_0을 llama.cpp 네이티브 서버로 실행합니다.
    cmds:
      - uv run --group llama-local python -m scripts.run_local_engine llama_cpp

  llama-smoke:
    desc: llama.cpp의 실제 JSON·SSE 계약과 지연을 검사합니다.
    cmds:
      - env RUN_LLAMA_MODEL_SMOKE=1 uv run --group llama-local pytest tests/integration/test_local_native_engines.py -k llama

  mlx-serve:
    desc: Qwen3-0.6B 4bit을 MLX-LM 네이티브 서버로 실행합니다.
    cmds:
      - uv run --group mlx-local python -m scripts.run_local_engine mlx_lm

  mlx-smoke:
    desc: MLX-LM의 실제 JSON·SSE 계약과 지연을 검사합니다.
    cmds:
      - env RUN_MLX_MODEL_SMOKE=1 uv run --group mlx-local pytest tests/integration/test_local_native_engines.py -k mlx

  kind-up:
    desc: 로컬 Qwen 실습용 Kind cluster를 생성합니다.
    preconditions:
      - sh: command -v kind
        msg: "kind가 필요합니다: brew install kind"
    cmds:
      - kind create cluster --config deploy/kubernetes/kind.yaml

  kserve-install:
    desc: Kind에 cert-manager와 KServe Standard Mode를 설치합니다.
    cmds:
      - helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager --version v1.17.2 --namespace cert-manager --create-namespace --set crds.enabled=true --wait --timeout 10m
      - helm upgrade --install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd --version v0.19.0 --namespace kserve --create-namespace --wait
      - helm upgrade --install kserve oci://ghcr.io/kserve/charts/kserve-resources --version v0.19.0 --namespace kserve --values deploy/kubernetes/kserve-values.yaml --wait --timeout 10m

  mlx-kind-image:
    desc: Linux CPU용 MLX-LM image를 빌드하고 Kind에 넣습니다.
    cmds:
      - docker build --file engines/mlx_cpu/Dockerfile --tag qwen-mlx-cpu:local .
      - kind load docker-image qwen-mlx-cpu:local --name qwen-serving

  kserve-deploy:
    desc: Qwen3-4B BF16 vLLM ARM64 CPU InferenceService를 배포합니다.
    cmds:
      - helm upgrade --install qwen-vllm-cpu charts/qwen-serving --namespace qwen-serving --create-namespace --values charts/qwen-serving/values-local-vllm-cpu.yaml
      - kubectl --namespace qwen-serving wait --for=condition=Ready inferenceservice/qwen-vllm-cpu --timeout=20m
      - kubectl --namespace qwen-serving rollout status deployment/qwen-vllm-cpu-predictor --timeout=20m

  kserve-forward:
    desc: Gateway가 KServe의 vLLM을 사용하도록 8005 포트를 연결합니다.
    cmds:
      - kubectl --namespace qwen-serving port-forward service/qwen-vllm-cpu-predictor 8005:80

  kserve-status:
    desc: KServe 모델의 준비 상태와 Pod를 확인합니다.
    cmds:
      - kubectl --namespace qwen-serving get inferenceservice,servingruntime,deployment,pod,service

  kserve-gateway:
    desc: Open WebUI와 KServe vLLM 사이의 Gateway를 8000 포트에서 실행합니다.
    cmds:
      - env CHAT_UI_ENABLED=false PUBLIC_API_KEY=local-public-key ENGINE_API_KEY= ENGINE_BASE_URL=http://127.0.0.1:8005 ENGINE_MODEL_NAME=qwen3-4b MODEL_ALIAS=qwen-demo ENABLE_THINKING=false RATE_LIMIT_REQUESTS=100 UPSTREAM_TIMEOUT_SECONDS=600 uv run uvicorn apps.gateway.main:app --host 127.0.0.1 --port 8000

  open-webui-up:
    desc: 대화 기록을 저장하는 Open WebUI를 3000 포트에서 실행합니다.
    cmds:
      - docker compose --file deploy/local/compose.open-webui.yaml up --detach

  open-webui-down:
    desc: Open WebUI를 중지합니다. 대화 기록 volume은 유지합니다.
    cmds:
      - docker compose --file deploy/local/compose.open-webui.yaml down

  open-webui-logs:
    desc: Open WebUI 로그를 확인합니다.
    cmds:
      - docker compose --file deploy/local/compose.open-webui.yaml logs --follow open-webui

  open-webui-status:
    desc: Open WebUI container 상태를 확인합니다.
    cmds:
      - docker compose --file deploy/local/compose.open-webui.yaml ps

  kserve-verify:
    desc: cluster 없이 vLLM CPU Helm chart를 검증합니다.
    cmds:
      - helm lint charts/qwen-serving --values charts/qwen-serving/values-local-vllm-cpu.yaml
      - env UV_CACHE_DIR=/private/tmp/qwen-serving-uv-cache uv run pytest tests/unit/test_kubernetes_chart.py

  kind-down:
    desc: 로컬 Qwen Kind cluster를 삭제합니다.
    cmds:
      - kind delete cluster --name qwen-serving

  chat-ui:
    desc: 실행 중인 llama.cpp 또는 MLX-LM을 선택하는 로컬 Chat UI를 엽니다.
    cmds:
      - env CHAT_UI_ENABLED=true PUBLIC_API_KEY=local-public-key MODEL_ALIAS=qwen-demo RATE_LIMIT_REQUESTS=100 UPSTREAM_TIMEOUT_SECONDS=600 uv run uvicorn apps.gateway.main:app --host 127.0.0.1 --port 8000

  gpu-verify:
    desc: RunPod을 생성하지 않고 4일차 GPU workflow와 smoke 구성을 검증합니다.
    cmds:
      - uv run python scripts/verify_gpu_workflow.py
      - uv run pytest tests/unit/test_runpod_payload.py tests/unit/test_runpod_readiness.py tests/unit/test_gpu_workflow.py tests/load/test_benchmark_runner.py tests/load/test_benchmark_summary.py

  architecture:
    desc: README의 모델 서빙과 CI/CD 아키텍처 PNG를 생성합니다.
    preconditions:
      - sh: command -v dot
        msg: "Graphviz가 필요합니다: brew install graphviz"
    cmds:
      - uv run --group docs python scripts/generate_architecture.py

  test:
    desc: 전체 자동 테스트를 실행합니다.
    cmds:
      - uv run pytest

  lint:
    desc: 코드 스타일과 기본 오류를 검사합니다.
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:
    desc: Python 코드를 자동 정리합니다.
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  typecheck:
    desc: 타입 힌트를 검사합니다.
    cmds:
      - uv run pyright

  verify:
    desc: 제출 전에 실행할 전체 검증입니다.
    deps: [lint, typecheck, test]
